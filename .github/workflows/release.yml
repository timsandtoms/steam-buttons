name: Release

# Pushing a tag like v1.0.0 builds the plugin zip and attaches it to a GitHub release.
# A tag with a suffix, like v1.1.0-beta.1, is published as a pre-release instead.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check tag matches plugin version
        run: |
          node -e '
            const fs = require("fs");
            const dir = "com.github.timsandtoms.steam-buttons.sdPlugin";
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "").replace(/-.*$/, "");
            const manifest = JSON.parse(fs.readFileSync(dir + "/manifest.json", "utf8")).Version;
            const pkg = JSON.parse(fs.readFileSync(dir + "/package.json", "utf8")).version;
            console.log("tag " + tag + ", manifest " + manifest + ", package.json " + pkg);
            if (manifest !== tag || pkg !== tag) {
              console.error("Version mismatch: the tag, manifest.json and package.json must all be the same.");
              process.exit(1);
            }
          '
      - name: Install runtime dependencies
        working-directory: com.github.timsandtoms.steam-buttons.sdPlugin
        run: npm ci --omit=dev
      - name: Package
        run: zip -r com.github.timsandtoms.steam-buttons.sdPlugin.zip com.github.timsandtoms.steam-buttons.sdPlugin
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" com.github.timsandtoms.steam-buttons.sdPlugin.zip --generate-notes --prerelease --latest=false
          else
            gh release create "$GITHUB_REF_NAME" com.github.timsandtoms.steam-buttons.sdPlugin.zip --generate-notes --latest
          fi
